# render.yaml — Render Blueprint for https://llms.2plot.dev
#
# This deploys the package's own demo app (app.py) as the documentation site
# for dash-improve-my-llms. It is also the reference deployment: whatever the
# package claims to do, this host demonstrates on real URLs.
#
# Deploying:
#   1. Push this repo to GitHub with render.yaml and Dockerfile at the root.
#   2. Render dashboard → New → Blueprint → select this repo.
#   3. Settings → Custom Domains → add llms.2plot.dev, then point that
#      subdomain's CNAME at the service hostname Render gives you.
#   4. Confirm APP_BASE_URL below matches the custom domain exactly. It drives
#      every <link rel="canonical"> on the site, so a mismatch tells search
#      engines the canonical home is somewhere else.
#
# Local equivalent:
#   docker build -t llms-2plot-dev .
#   docker run --rm -p 8959:8959 -e PORT=8959 llms-2plot-dev
#   open http://localhost:8959
#
# Blueprint spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: llms-2plot-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Starter (paid) as of the x402 instrumentation rollout, for two reasons
    # that both stopped being acceptable when this host joined the dataset:
    #   - free sleeps after ~15 min idle; a cold start in front of a crawler
    #     fetch skews the very crawl-demand numbers this host now reports;
    #   - the analytics ledger is no longer demo data — it feeds the hourly
    #     satellite rollup the hub's 402 board prices against, so it lives
    #     on the persistent disk below and must survive deploys.
    plan: starter
    region: oregon

    # The analytics ledger's home. Ephemeral filesystems reset the ledger on
    # every deploy, and the hub keeps the LAST report per (app, date) — so a
    # mid-day deploy would overwrite the day's real totals with whatever
    # accumulated since the restart. 1 GB is years of runway at this ledger's
    # retention settings.
    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1

    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      # The public origin. Everything canonical-shaped derives from this.
      - key: APP_BASE_URL
        value: https://llms.2plot.dev

      # Flask (WSGI), served by gunicorn — matches the rest of the network's
      # docs sites. Do not switch to fastapi/quart here without also switching
      # the Dockerfile to uvicorn: those backends are ASGI and gunicorn's sync
      # worker cannot serve them.
      - key: DASH_BACKEND
        value: flask

      # 2 workers × 4 threads fits comfortably in the free tier's 512 MB for a
      # docs site. Drop to 1 if memory gets tight.
      - key: WEB_CONCURRENCY
        value: "2"

      - key: PYTHONUNBUFFERED
        value: "1"

      # The network bulletin endpoint that supplies the "Tips for getting
      # started" and "What's new" panels in the llms.txt viewer header.
      # 2plot.dev serves this now, so it is set rather than left blank.
      # app.py sends app_id="llms" alongside it, which is how the hub's
      # /admin/network-board Satellites tab confirms this site is rendering
      # the bulletin. A dead endpoint degrades to "no bulletin", never a 500.
      # See docs/BULLETIN.md for the contract.
      - key: NETWORK_BULLETIN_URL
        value: https://2plot.dev/api/network/bulletin

      # ----------------------------------------------------------------
      # Satellite analytics (the x402 instrumentation rollout)
      # ----------------------------------------------------------------

      # The ledger lives on the persistent disk (see `disk:` above), so the
      # hourly rollup never re-reports a day from a freshly-wiped file.
      - key: TRAFFIC_ANALYTICS_FILE
        value: /var/data/visitor_analytics.json

      # This host's key in the hub's network directory. Unique fleet-wide —
      # a duplicate key overwrites another satellite's rows at the hub.
      - key: SATELLITE_APP_KEY
        value: llms

      # Shared HMAC secret for the signed rollup POST. Dashboard-set at
      # deploy time (sync: false keeps it out of this file); without it the
      # reporter prints one "disabled" line and the app runs unaffected.
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false

      # Corpus document tiers — instrumentation defaults: everything public.
      # The hub's page-tier ceilings can tighten these network-wide later
      # without a redeploy here.
      - key: LLMS_SMALL_TIER
        value: public
      - key: LLMS_FULL_TIER
        value: public

      # ----------------------------------------------------------------
      # /admin access
      # ----------------------------------------------------------------

      # The /admin dashboard reads the visitor ledger, which on this disk is
      # real and persistent. mark_hidden("/admin") only DELISTS the page —
      # robots.txt even publishes the path — so the layout is gated on this
      # token (lib/admin_gate.py). Dashboard-set, like the webhook secret.
      # Unset means locked: the page renders an "authentication required"
      # placeholder and never opens the ledger. Present it once as
      # https://llms.2plot.dev/admin?token=<value>; a derived cookie keeps
      # the browser unlocked for 12 hours.
      - key: ADMIN_DASH_TOKEN
        sync: false

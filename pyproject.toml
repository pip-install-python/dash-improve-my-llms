[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-improve-my-llms"
version = "2.8.0"
description = "Crawler/SEO companion for Dash apps: /llms.txt, /robots.txt, /sitemap.xml, bot detection, static-HTML prerender, and an MCP bridge. Works with Flask, FastAPI, and Quart backends (Dash 4.1+)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Pip Install Python LLC", email = "pipinstallpython@gmail.com"}
]
maintainers = [
    {name = "Pip Install Python LLC", email = "pipinstallpython@gmail.com"}
]
keywords = [
    "dash",
    "plotly",
    "llms",
    "ai",
    "mcp",
    "documentation",
    "llms.txt",
    "plugin",
    "hook",
    "bot-detection",
    "robots-txt",
    "sitemap",
    "seo",
    "web-crawlers",
    "ai-bots",
    "fastapi",
    "quart",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Dash",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
# Tested against dash 4.1.0, 4.2.0, 4.3.0, 4.4.0 and 4.4.1 across the Flask,
# FastAPI and Quart backends — see scripts/matrix.py and the CI job matrix.
# 4.1.0 is the floor: it is the first release this package's Dash 4 support
# targets, and it is Flask-only (pluggable backends arrived in 4.2).
dependencies = [
    "dash>=4.1,<5",
]

[project.optional-dependencies]
flask = ["flask>=2.0.0"]
fastapi = ["fastapi>=0.110", "starlette>=0.36"]
quart = ["quart>=0.19"]
all = ["flask>=2.0.0", "fastapi>=0.110", "starlette>=0.36", "quart>=0.19"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "dash-mantine-components>=2.0.0",  # For testing with example app
    "flask>=2.0.0",
    "fastapi>=0.110",
    "starlette>=0.36",
    "httpx>=0.27",  # for fastapi.testclient
    "quart>=0.19",
]

[project.urls]
Homepage = "https://pip-install-python.com"
Documentation = "https://github.com/pip-install-python/dash-improve-my-llms#readme"
Repository = "https://github.com/pip-install-python/dash-improve-my-llms"
"Bug Tracker" = "https://github.com/pip-install-python/dash-improve-my-llms/issues"
"Plotly Pro" = "https://plotly.pro"

[tool.setuptools]
packages = ["dash_improve_my_llms"]
include-package-data = true

[tool.setuptools.package-data]
# The crawler IP-range snapshots ship in the wheel: _identity reads them
# from disk and never fetches on the request path.
dash_improve_my_llms = ["py.typed", "_ranges/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is deliberately NOT in addopts. Forcing --cov here makes the suite
# unrunnable in any environment without pytest-cov — including the per-Dash
# version environments in scripts/matrix.py. Opt in instead:
#     pytest --cov=dash_improve_my_llms --cov-report=term-missing
addopts = ["--verbose"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.coverage.run]
source = ["dash_improve_my_llms"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
